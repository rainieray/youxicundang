<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这档恋综不对劲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f5eaff;
    background:
      radial-gradient(circle at 15% 10%, #3a1d5e 0%, transparent 50%),
      radial-gradient(circle at 85% 90%, #4a1f3d 0%, transparent 50%),
      linear-gradient(160deg, #1a0b2e 0%, #120820 50%, #0b0616 100%);
    background-attachment: fixed;
  }

  .game {
    width: min(680px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: 28px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .hud {
    align-self: center;
    padding: 10px 26px;
    border-radius: 999px;
    font-size: .9rem;
    letter-spacing: .12em;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.14);
    min-width: 220px;
    text-align: center;
  }
  .hud span { display: inline-block; }

  .story-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px 30px;
    border-radius: 20px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.14);
  }

  .story-text {
    flex: 1;
    min-height: 180px;
    font-size: 1rem;
    line-height: 2;
    color: #c9b8e0;
    white-space: pre-wrap;
  }

  .divider {
    height: 1px;
    margin: 22px 0;
    background: linear-gradient(90deg,
      transparent,
      rgba(255,107,157,.55),
      rgba(197,108,240,.55),
      transparent);
  }

  .affection {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: .9rem;
    letter-spacing: .04em;
    color: #c9b8e0;
    min-height: 24px;
  }
  .aff-line b { color: #ffd93d; font-weight: 600; }
  .aff-desc { color: #8f7fa8; }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .choice-btn {
    padding: 16px 24px;
    border-radius: 14px;
    font-family: inherit;
    font-size: .98rem;
    letter-spacing: .08em;
    color: #f5eaff;
    cursor: pointer;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18);
    transition: transform .2s, background .2s, border-color .2s;
  }
  .choice-btn:hover {
    background: rgba(255,107,157,.15);
    border-color: rgba(255,107,157,.6);
  }
  .choice-btn.primary {
    color: #fff;
    border: none;
    background: linear-gradient(135deg, #ff6b9d, #c56cf0);
  }

  .mood {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.08);
  }

  .mood-title {
    font-size: .82rem;
    letter-spacing: .1em;
    color: #8f7fa8;
    text-align: center;
    margin-bottom: 2px;
  }

  #mood-rows {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 20px;
  }

  .mood-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: .82rem;
    letter-spacing: .06em;
  }

  .mood-name { flex: none; width: 44px; color: #c9b8e0; }

  .mood-bar {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }

  .mood-fill {
    height: 100%;
    border-radius: 999px;
    transition: width .5s ease;
  }

  .mood-num {
    flex: none;
    width: 40px;
    text-align: right;
    color: #ffd93d;
    font-variant-numeric: tabular-nums;
  }

  .mood-numbness { background: linear-gradient(90deg,#6b6b8a,#8f8fb0); }
  .mood-pain     { background: linear-gradient(90deg,#8a4b6b,#c56cf0); }
  .mood-joy      { background: linear-gradient(90deg,#ff6b9d,#ffd93d); }
</style>
</head>
<body>

<main class="game">

  <header class="hud">
    <span id="hud-day"></span>
    <span id="hud-weekday"></span>
    <span id="hud-weather"></span>
  </header>

  <section class="story-box">
    <div class="story-text" id="story-text"></div>
    <div class="divider"></div>
    <div class="affection" id="affection"></div>
  </section>

  <footer class="choices" id="choices"></footer>

  <div class="mood">
    <div class="mood-title">你目前的状态是：</div>
    <div id="mood-rows"></div>
  </div>

</main>

<script src="js/config.js"></script>
<script src="js/story.js"></script>
<script src="js/routes.js"></script>
<script src="js/events.js"></script>
<script src="js/endings.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
