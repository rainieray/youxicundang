<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这档恋综不对劲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff6b9d;
    --purple: #c56cf0;
    --gold: #ffd93d;
    --text: #f5eaff;
    --text-dim: #c9b8e0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 18% 12%, #3a1d5e 0%, transparent 52%),
      radial-gradient(circle at 84% 88%, #4a1f3d 0%, transparent 52%),
      linear-gradient(160deg, #1a0b2e 0%, #120820 50%, #0b0616 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .45;
    background-image:
      radial-gradient(1.5px 1.5px at 30px 40px, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 140px 90px, rgba(255,182,210,.7), transparent),
      radial-gradient(1.2px 1.2px at 220px 30px, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 90px 160px, rgba(197,108,240,.8), transparent);
    background-size: 260px 260px, 260px 260px, 260px 260px, 260px 260px;
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .25; } to { opacity: .55; } }

  .container {
    position: relative;
    z-index: 1;
    width: min(560px, 100%);
    display: flex;
    flex-direction: column;
    gap: 26px;
    animation: rise .8s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header { text-align: center; }

  .kicker {
    font-size: .78rem;
    letter-spacing: .42em;
    color: var(--gold);
    opacity: .85;
    margin-bottom: 14px;
    text-indent: .42em;
  }

  .title {
    font-size: clamp(2.1rem, 7.5vw, 3.6rem);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.25;
    background: linear-gradient(135deg, #ffffff 0%, #ffb8d4 28%, #ff6b9d 52%, #c56cf0 76%, #ffd93d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,107,157,.55));
  }

  .title-line {
    width: 120px;
    height: 2px;
    margin: 18px auto 0;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--pink), var(--purple), transparent);
  }

  .intro {
    padding: 26px 28px;
    border-radius: 20px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.1);
  }

  .intro h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: .18em;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .intro h2::before {
    content: "";
    width: 4px;
    height: 16px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--pink), var(--purple));
  }

  .intro p {
    font-size: .95rem;
    line-height: 1.95;
    color: var(--text-dim);
    letter-spacing: .03em;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    position: relative;
    padding: 17px 28px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: .22em;
    text-indent: .22em;
    color: var(--text);
    cursor: pointer;
    overflow: hidden;
    transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d 0%, #c56cf0 100%);
    color: #fff;
    box-shadow: 0 8px 28px rgba(255,107,157,.42);
  }
  .btn-primary:hover {
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 14px 38px rgba(255,107,157,.62);
  }

  .btn-ghost {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.18);
    color: var(--text-dim);
  }
  .btn-ghost:hover {
    transform: translateY(-2px);
    color: #fff;
    background: rgba(255,255,255,.1);
    border-color: rgba(255,107,157,.55);
    box-shadow: 0 10px 28px rgba(197,108,240,.28);
  }

  .btn:active { transform: translateY(0) scale(.985); }

  .btn-primary::after {
    content: "";
    position: absolute;
    top: 0; left: -70%;
    width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-22deg);
    transition: left .6s ease;
  }
  .btn-primary:hover::after { left: 130%; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 46px;
    transform: translate(-50%, 16px);
    padding: 12px 26px;
    border-radius: 999px;
    font-size: .88rem;
    letter-spacing: .06em;
    color: #ffd9e8;
    background: rgba(18,8,32,.94);
    border: 1px solid rgba(255,107,157,.45);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 420px) {
    .intro { padding: 22px 20px; }
    .btn { padding: 15px 20px; font-size: .95rem; }
  }
</style>
</head>
<body>

  <main class="container">

    <header class="header">
      <div class="kicker">恋爱真人秀 · 互动企划</div>
      <h1 class="title">这档恋综不对劲</h1>
      <div class="title-line"></div>
    </header>

    <section class="intro">
      <h2>剧情介绍</h2>
      <p>
        你被临时拉来救场，成为这档恋爱综艺的替补嘉宾。<br>
        镜头前，六位性格迥异的同居者笑得温柔体贴；<br>
        镜头后，剧本、剪辑、热搜，一切都有人在暗中操控。<br>
        而你的每一次选择，都在悄悄改写结局。
      </p>
    </section>

    <nav class="menu">
      <button class="btn btn-primary" data-page="game.html">开始游戏</button>
      <button class="btn btn-ghost"   data-page="characters.html">角色介绍</button>
      <button class="btn btn-ghost"   data-page="extras.html">番外</button>
    </nav>

  </main>

  <div class="toast" id="toast"></div>

<script>
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  document.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = btn.dataset.page;

      if (page === 'game.html' || page === 'characters.html') {
        location.href = page;
        return;
      }

      showToast(`「${btn.textContent}」页面还在制作中～`);
    });
  });
</script>

</body>
</html>
